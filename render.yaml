services:
  # PostgreSQL Database
  - type: pserv
    name: capturedbychristian-db
    env: production
    plan: starter
    databaseName: capturedcollective
    databaseUser: postgres

  # Main Application
  - type: web
    name: capturedbychristian-app
    env: production
    plan: starter
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start:debug
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: capturedbychristian-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPENAI_API_KEY
        value: ""
      - key: TWILIO_ACCOUNT_SID
        value: ""
      - key: TWILIO_AUTH_TOKEN
        value: ""
      - key: TWILIO_PHONE_NUMBER
        value: ""