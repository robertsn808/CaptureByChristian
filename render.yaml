services:
  # Main Application Service
  - type: web
    name: capturedbychristian-app
    env: docker
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7000
      - key: DATABASE_URL
        fromDatabase:
          name: capturedbychristian-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: capturedbychristian-app
          property: host
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - package*.json
        - server/**
        - client/**
        - migrations/**
        - shared/**
        - attached_assets/**
        - build-server.js
        - tsconfig.build.json
        - drizzle.config.ts
    autoDeploy: true
    
  # Redis for caching (optional)
  - type: redis
    name: capturedbychristian-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru

databases:
  # PostgreSQL Database
  - name: capturedbychristian-db
    plan: starter
    region: oregon
    databaseName: capturedcollective
    user: postgres

# Previews for PRs
previews:
  generation: automatic
