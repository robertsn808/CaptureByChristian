services:
  # Main Application Service
  - type: web
    name: capturedbychristian-app
    env: docker
    dockerfilePath: ./Dockerfile.render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 7000
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: capturedbychristian-app
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: capturedbychristian-app
          property: host
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - package*.json
        - server/**
        - client/**
        - migrations/**
        - shared/**
        - attached_assets/**
        - build-server.js
        - tsconfig.build.json
        - drizzle.config.ts
    autoDeploy: true
  # Redis for caching (optional)
  - type: redis
    name: capturedbychristian-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

## Note: No databases section to avoid creating a new DB.
## DATABASE_URL pulls from an existing Render Postgres named 'capturedbychristian-db'.

# Previews disabled (not available on Hobby)
